version: '3.8'

services:
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ~/Universal_Trade_Platform/redis:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - redis-net
      - psup-shared-net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "7777:7777"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - redis-net
      - psup-shared-net

networks:
  redis-net:
    driver: bridge
  psup-shared-net:
    external: true